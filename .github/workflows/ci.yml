name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  analyze:
    name: Analyze, i18n & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the maintainer's local version so CI's analyzer matches
          # local (floating `stable` pulled newer lints/deprecations and broke).
          # Keep this in step when the local SDK moves: a stale pin is what let
          # a dependency that needs a newer Dart resolve locally and fail here.
          flutter-version: 3.47.2
          cache: true

      - name: Install libmpv
        # media_kit loads libmpv at runtime, so tests that construct a Player
        # (e.g. volume_sync_test) need it present on the runner.
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        # lib/l10n/generated isn't committed (Weblate commits only ARB files),
        # so this also fails the build on an ARB file gen-l10n can't read.
        run: flutter gen-l10n

      - name: i18n guard (no hardcoded UI strings)
        run: ./tool/i18n_guard.sh

      - name: Analyze
        # Warnings and errors fail the build; advisory infos (style lints) don't.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test
