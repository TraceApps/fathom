name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  analyze:
    name: Analyze, i18n & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the maintainer's local version so CI's analyzer matches
          # local (floating `stable` pulled newer lints/deprecations and broke).
          # Keep this in step when the local SDK moves: a stale pin is what let
          # a dependency that needs a newer Dart resolve locally and fail here.
          flutter-version: 3.47.2
          cache: true

      - name: Install libmpv
        # media_kit loads libmpv at runtime, so tests that construct a Player
        # (e.g. volume_sync_test) need it present on the runner.
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        # lib/l10n/generated isn't committed (Weblate commits only ARB files),
        # so this also fails the build on an ARB file gen-l10n can't read.
        run: flutter gen-l10n

      - name: i18n guard (no hardcoded UI strings)
        run: ./tool/i18n_guard.sh

      - name: Analyze
        # Warnings and errors fail the build; advisory infos (style lints) don't.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        # The suite takes a few minutes; a hang (a native player left
        # running) fails here rather than holding the runner for hours.
        timeout-minutes: 20
        run: flutter test

  server:
    # The core flows against real Jellyfin servers, an old one and the
    # current one, so a server change that breaks Fathom fails here.
    name: Real server (Jellyfin ${{ matrix.jellyfin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['10.8.13', '10.10.7', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Install ffmpeg
        # Makes the short test movie.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Start Jellyfin ${{ matrix.jellyfin }}
        run: ./tool/server_test_setup.sh "jellyfin/jellyfin:${{ matrix.jellyfin }}" | grep '^FATHOM_' >> "$GITHUB_ENV"

      - name: Sign in, browse, play, resume, mark watched, subtitles
        timeout-minutes: 10
        run: flutter test test/server/jellyfin_flows_test.dart

      - name: Server log, when it failed
        if: failure()
        run: docker logs --tail 200 fathom-server-test
